      shareCount, siteClickCount. Плюс дополнительно lastSessionStartAt и
      lastActivityAt для расчёта длительности сеанса. - Все функции записи
      (recordBotStart, recordThemeSelected, recordPointViewed,
      recordRouteFinished, recordShare, recordSiteClick) должны быть async,
