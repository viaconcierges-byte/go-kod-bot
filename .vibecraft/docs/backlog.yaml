      она неправильно разбирает результат команды SCAN от Upstash
      Redis.  Upstash Redis REST возвращает результат SCAN как массив из двух
      элементов: [cursor, [keys...]]. Например: { result: ["0",
      ["bot:analytics:123", "bot:analytics:456"]] }.  Текущий код делает: ```ts
