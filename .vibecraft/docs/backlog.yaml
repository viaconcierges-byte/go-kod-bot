      KV_REST_API_URL и KV_REST_API_TOKEN. REST-интерфейс Upstash: POST к
      `${KV_REST_API_URL}/<command>` с заголовком `Authorization: Bearer
      ${KV_REST_API_TOKEN}` и телом — JSON-массивом аргументов. Ответ — объект
      `{ result: ... }`. Примеры:   - GET: POST `{KV_REST_API_URL}/get` тело
      `["bot:analytics:all"]`   - SET: POST `{KV_REST_API_URL}/set` тело
