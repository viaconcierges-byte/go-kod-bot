    title: Исправить ошибку загрузки изображений Unsplash
    description: "При открытии маршрута «Архитектура» возникает ошибка Runtime
      Error: hostname images.unsplash.com не настроен в next.config. Нужно
      настроить конфигурацию Next.js, чтобы изображения с Unsplash загружались
      корректно."
    status: completed
    acceptance_criteria:
      - Маршрут «Архитектура» открывается без ошибок
      - Изображения точек маршрута отображаются корректно
      - Остальные маршруты также работают без ошибок изображений
