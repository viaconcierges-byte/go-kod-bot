phases:
  - id: mvp
    name: MVP
    description: Минимально жизнеспособный продукт
    order: 1
tasks:
  - id: task-001
    phase: mvp
    title: Визуальная заглушка главной страницы
    description: >-
      Создать главную страницу приложения со статическими данными-заглушками.

      Цель: дать пользователю первый визуальный результат как можно быстрее.

      Реализовать только то, что пользователь увидит сразу при открытии
      приложения. Остальные страницы приложения реализовывать не нужно.
    priority: high
    acceptance_criteria:
      - Главная страница отображается без ошибок
      - Данные отображаются из статических заглушек
    depends_on: []
    related_feature: Выбор темы маршрута
    status: completed
    summary:
      "Создана главная страница с приветствием «Куда хотите отправиться?» и
      карточками 5 тем: Архитектура, Мистика, Особняки, Литература, Современный
      Петербург. Данные тем — статические заглушки в lib/data.ts. Основная
      реализация: app/page.tsx."
  - id: task-002
    phase: mvp
    title: Выбор темы маршрута
    description: "Пользователь запускает бота и видит приветствие «Куда хотите
      отправиться?» с кнопками тем: Архитектура, Мистика, Особняки, Литература,
      Современный Петербург. Каждая тема имеет короткое описание."
    priority: high
    acceptance_criteria:
      - При старте бот приветствует пользователя с вопросом «Куда хотите
        отправиться?»
      - "Показываются кнопки с 5 темами: Архитектура, Мистика, Особняки,
        Литература, Современный Петербург"
      - Каждая тема имеет понятное название и короткое описание
    depends_on:
      - task-001
    related_feature: Выбор темы маршрута
    status: completed
    summary: "Сделан интерактивный выбор темы маршрута. Главная страница
      приветствует пользователя вопросом «Куда хотите отправиться?» и показывает
      кликабельные карточки 5 тем (Архитектура, Мистика, Особняки, Литература,
      Современный Петербург), у каждой из которых понятное название и короткое
      описание. По клику выбранная тема отображается с её названием и описанием,
      есть кнопка возврата к выбору. Основная реализация:
      components/theme-selector.tsx, app/page.tsx."
  - id: task-006
    phase: mvp
    title: Добавить логотип на главную страницу
    description: На главной странице над приветствием «Куда хотите отправиться?»
      отображается логотип Go Kod Bot. Логотип лежит в файле
      .vibecraft/assets/Логотип.PNG.
    priority: medium
    acceptance_criteria:
      - Логотип отображается над приветствием на главной странице
      - Логотип не ломает вёрстку на мобильных экранах
    depends_on: []
    related_feature: Выбор темы маршрута
    status: completed
    summary:
      "Логотип Go Kod Bot добавлен на главную страницу над приветствием «Куда
      хотите отправиться?». Логотип скопирован из .vibecraft/assets/Логотип.PNG
      в public/assets/logo.png и выводится через next/image с фиксированным
      размером 120x120, что не ломает вёрстку на мобильных экранах. Основная
      реализация: components/theme-selector.tsx."
  - id: task-003
    phase: mvp
    title: Генерация маршрута по выбранной теме
    description: После выбора темы бот собирает маршрут из 3–5 ключевых точек,
      связанных с темой. Каждая точка содержит название, короткое описание,
      адрес и ссылку на фото. В конце маршрута — фраза «Хотите увидеть это с
      гидом? Забронируйте экскурсию на сайте spbkod.ru» с ссылкой.
    priority: high
    acceptance_criteria:
      - Маршрут содержит 3–5 точек с названием, описанием, адресом и фото
      - После маршрута отображается фраза с призывом забронировать на spbkod.ru
      - Маршрут можно получить заново или вернуться к выбору темы
    depends_on:
      - task-002
    related_feature: Генерация маршрута по теме
    status: completed
    summary:
      "Реализована генерация маршрута по выбранной теме. Каждая тема содержит
      4 точки с названием, описанием, адресом и фото (Unsplash). В конце
      маршрута отображается фраза «Хотите увидеть это с гидом? Забронируйте
      экскурсию на сайте spbkod.ru» с ссылкой. Доступны кнопки «Вернуться к
      выбору темы» и «Пройти маршрут заново». Основная реализация:
      components/route-display.tsx, lib/data.ts, components/theme-selector.tsx."
  - id: task-004
    phase: mvp
    title: Детали точки маршрута
    description: "У каждой точки маршрута есть кнопка «Подробнее». Нажав на неё,
      пользователь получает расширенное описание: историю места, интересный
      факт, рекомендацию когда лучше прийти и ссылку на фото. Из деталей можно
      вернуться к маршруту."
    priority: medium
    acceptance_criteria:
      - У каждой точки маршрута есть кнопка «Подробнее»
      - Расширенное описание содержит историю или интересный факт и фото
      - Из деталей можно вернуться к маршруту
    depends_on:
      - task-003
    related_feature: Детали точки маршрута
    status: completed
    summary:
      "Реализованы детали точки маршрута. У каждой точки маршрута добавлена
      кнопка «Подробнее» с иконкой Info. При нажатии открывается страница
      деталей с историей места, интересным фактом, рекомендацией когда лучше
      прийти и фото. Из деталей можно вернуться к маршруту через кнопку
      «Вернуться к маршруту». Основная реализация: components/point-detail.tsx,
      components/route-display.tsx, lib/data.ts."
