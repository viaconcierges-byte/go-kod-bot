    title: Сохранение и шеринг маршрута
    description: После получения маршрута бот предлагает кнопки «Поделиться»
      (копирование маршрута текстом) и «Сохранить» (короткая памятка с точками).
    priority: medium
    acceptance_criteria:
      - Кнопка «Поделиться» копирует маршрут в удобном текстовом формате
      - Кнопка «Сохранить» показывает компактную версию маршрута
    depends_on:
