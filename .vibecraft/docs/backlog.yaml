      "bot:analytics:*", "COUNT", "1000"]); const keys = (cursor as unknown as {
      keys?: string[] })?.keys ?? []; ``` Это неправильно: результат SCAN — это
      массив, а не объект с полем keys. Из-за этого keys всегда пустой, и
      статистика не суммируется (по нулям).  Исправь так, чтобы keys извлекались
      из второго элемента массива результата SCAN: ```ts const result = await
      kvCommand<unknown>("scan", ["0", "MATCH", "bot:analytics:*", "COUNT",
      "1000"]); const arr = Array.isArray(result) ? result : []; const keys:
      string[] = Array.isArray(arr[1]) ? arr[1] : []; ```  Остальной код
      getAnalyticsStats (цикл по keys, чтение каждого ключа через get, агрегация
      в stats) оставить как есть. Также подумай, что SCAN может вернуть только
      первую страницу ключей — для надёжности можно использовать COUNT побольше
