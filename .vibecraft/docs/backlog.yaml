        }
        return {
          userId: String(userId),
          startCount: 0,
          themeStarts: {},
          reachedLastPoint: {},
          routeFinishes: {},
          shareCount: 0,
          siteClickCount: 0,
          totalSessionMs: 0,
          sessionCount: 0,
          lastSessionStartAt: null,
          lastActivityAt: Date.now(),
        };
      }


      async function saveAnalyticsRow(row: BotAnalytics): Promise<void> {
        await kvCommand("set", [keyFor(row.userId ? Number(row.userId) : 0), JSON.stringify(row)]);
      }


      function closeSession(row: BotAnalytics, now: number): void {
        if (row.lastSessionStartAt == null) return;
        row.totalSessionMs += Math.max(0, now - row.lastSessionStartAt);
        row.sessionCount += 1;
        row.lastSessionStartAt = null;
      }


      export function recordBotStart(userId: number): void {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          const now = Date.now();
          closeSession(row, now);
          row.startCount += 1;
          row.lastSessionStartAt = now;
          row.lastActivityAt = now;
          await saveAnalyticsRow(row);
        });
      }


      export function recordThemeSelected(userId: number, themeId: string): void
      {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          row.themeStarts[themeId] = (row.themeStarts[themeId] ?? 0) + 1;
          row.lastActivityAt = Date.now();
          await saveAnalyticsRow(row);
        });
      }


      export function recordPointViewed(
        userId: number,
        themeId: string,
        pointIndex: number,
        pointTotal: number
      ): void {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          if (pointTotal > 0 && pointIndex === pointTotal - 1) {
            row.reachedLastPoint[themeId] = (row.reachedLastPoint[themeId] ?? 0) + 1;
          }
          row.lastActivityAt = Date.now();
          await saveAnalyticsRow(row);
        });
      }


      export function recordRouteFinished(userId: number, themeId: string): void
      {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          const now = Date.now();
          closeSession(row, now);
          row.routeFinishes[themeId] = (row.routeFinishes[themeId] ?? 0) + 1;
          row.lastActivityAt = now;
          await saveAnalyticsRow(row);
        });
      }


      export function recordShare(userId: number): void {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          row.shareCount += 1;
          row.lastActivityAt = Date.now();
          await saveAnalyticsRow(row);
        });
      }


      export function recordSiteClick(userId: number): void {
        fireAndForget(async () => {
          const row = await getAnalyticsRow(userId);
          row.siteClickCount += 1;
          row.lastActivityAt = Date.now();
          await saveAnalyticsRow(row);
        });
      }


      export async function getAnalyticsStats(): Promise<AnalyticsStats> {
        const stats: AnalyticsStats = {
          totalStarts: 0,
          themeStarts: {},
          reachedLastPoint: {},
          routeFinishes: {},
          totalSessionMs: 0,
          sessionCount: 0,
          shareCount: 0,
          siteClickCount: 0,
        };
        const cursor = await kvCommand<string>("scan", ["0", "MATCH", "bot:analytics:*", "COUNT", "1000"]);
        const keys = (cursor as unknown as { keys?: string[] })?.keys ?? [];
        const merge = (target: Record<string, number>, source?: Record<string, number>) => {
          if (!source) return;
          for (const [key, value] of Object.entries(source)) {
            target[key] = (target[key] ?? 0) + value;
          }
        };
        for (const key of keys) {
          const raw = await kvCommand<string>("get", [key]);
          if (!raw) continue;
          try {
            const row = JSON.parse(raw) as BotAnalytics;
            stats.totalStarts += row.startCount ?? 0;
            stats.shareCount += row.shareCount ?? 0;
            stats.siteClickCount += row.siteClickCount ?? 0;
            stats.totalSessionMs += row.totalSessionMs ?? 0;
            stats.sessionCount += row.sessionCount ?? 0;
            merge(stats.themeStarts, row.themeStarts);
            merge(stats.reachedLastPoint, row.reachedLastPoint);
            merge(stats.routeFinishes, row.routeFinishes);
          } catch {
            // ignore
          }
        }
        return stats;
      }

      ```


      Убедись, что файл lib/bot/analytics.ts содержит ровно этот код (без
      импортов @aws-sdk, @/lib/db и @/lib/schema). Проверь, что он компилируется
      (npm run typecheck).
    status: completed
